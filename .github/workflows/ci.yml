name: CI

on: [push, pull_request]

jobs:
  win:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [msvc-x86-debug, msvc-x86-release]
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install Windows libs
      shell: cmd
      run: |
        curl -LJO https://github.com/q4a/rrr3d/releases/download/1.3.1-dev2/extern.7z
        7z x extern.7z
        dir
    - uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x86
    - name: Configure and build
      run: |
        cmake --preset=${{ matrix.configuration }}
        cmake --build build/${{ matrix.configuration }}
    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: rrr3d.${{ matrix.configuration }}
        path: bin
